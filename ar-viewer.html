<!DOCTYPE html>
<html>
<head>
  <title>AR Car • Scan the marker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    <!-- Car model -->
    <a-entity 
      gltf-model="ur[](https://cdn.sketchfab.com/models/4c78ea06b0e541f788faab1711bd175e/glb/low-poly-suv-car.glb)"
      scale="0.4 0.4 0.4"
      position="0 0.1 -1.5"
      rotation="0 180 0"
      animation="property: rotation; to: 0 540 0; loop: true; dur: 20000; easing: linear"
      interactive>
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 2"></a-entity>

    <!-- Use Hiro marker (most reliable) -->
    <a-marker preset="hiro">
      <a-entity position="0 0 0" cursor="rayOrigin: mouse"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Instructions overlay -->
  <div style="position:absolute; top:10px; left:10px; right:10px; background:rgba(0,0,0,0.6); color:white; padding:15px; border-radius:10px; z-index:10; font-family:Arial;">
    <strong>Point your phone at the Hiro marker to see the car!</strong><br>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/HIRO.jpg" width="120" style="margin-top:10px; border:2px solid white;">
  </div>

  <script>
    // Simple interactivity: tap to spin faster
    AFRAME.registerComponent('interactive', {
      init: function () {
        this.el.addEventListener('click', () => {
          this.el.setAttribute('animation', 'dur: 4000');
          setTimeout(() => this.el.setAttribute('animation', 'dur: 20000'), 5000);
        });
      }
    });
  </script>
</body>
</html>
