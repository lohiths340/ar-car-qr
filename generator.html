<!DOCTYPE html>
<html>
<head>
  <title>AR Car QR Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    .card { background: white; max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    input, button { padding: 12px; margin: 10px; font-size: 16px; }
    button { background: #0066ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #qrcode { margin: 30px auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AR Car QR Code Generator</h1>
    <p>Generate a QR → Scan with phone → See the car in real space!</p>
    
    <input type="text" id="customText" placeholder="Custom message (optional)" value="Drive this car in AR!">
    <br>
    <button onclick="generateQR()">Generate QR Code</button>
    
    <div id="qrcode"></div>
    <p id="qrUrl"></p>
    
    <p>
      <a href="/ar-viewer.html" target="_blank">Test AR Viewer</a> • 
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/HIRO.jpg" target="_blank">Print Hiro Marker</a>
    </p>
  </div>

  <script>
    function generateQR() {
      const baseUrl = window.location.origin + '/ar-viewer.html';
      const text = document.getElementById('customText').value;
      const url = text ? `${baseUrl}?msg=${encodeURIComponent(text)}` : baseUrl;
      
      document.getElementById('qrUrl').innerHTML = `<strong>Link:</strong> <a href="${url}" target="_blank">${url}</a>`;
      
      QRCode.toCanvas(document.getElementById('qrcode'), url, { width: 280 }, (err) => {
        if (err) console.error(err);
      });
    }
    generateQR();
  </script>
</body>
</html>
